[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kk_codeimg"
version = "0.0.1"
description = "把代码渲染成精美的代码图片：12 套主题、16 种预设风格，支持窗口标题与中英文混排，纯 Pillow + Pygments 离线渲染"
# GitHub 用双语完整版 README.md。PyPI 不支持相对路径图片，
# 发版时临时切到 README_PYPI.md（该文件仅本地保留，不入仓库）。
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Python卡皮巴拉" }]
keywords = [
    "code-image", "codeimg", "code-screenshot", "carbon",
    "syntax-highlight", "png", "thumbnail", "social-media",
    "代码截图", "代码图片", "分享图",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

dependencies = [
    "pillow>=9.0",
    "pygments>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/kapikkkk/kk_codeimg"
Repository = "https://github.com/kapikkkk/kk_codeimg"
Issues = "https://github.com/kapikkkk/kk_codeimg/issues"

[tool.setuptools]
# 只打包 kk_codeimg 包，不含 out/ scripts/ 等
packages = ["kk_codeimg"]

[tool.setuptools.package-data]
kk_codeimg = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["scripts"]
